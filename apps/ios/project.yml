name: Wallet
options:
  bundleIdPrefix: com.example   # placeholder; set your real identifier before signing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Wallet:
    type: application
    platform: iOS
    sources: [Wallet, WalletCore/Sources/WalletCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wallet
        PRODUCT_NAME: Wallet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wallet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Wallet:
    build:
      targets:
        Wallet: all
    run:
      config: Debug
